name: CI - Spring Boot

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      - name: Trivy - Scanner para vulnerabilidades em dependências
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

# O arquivo .jar já foi gerado no etapa de build nesta etapa irá fazer o upload -> Armazena o .jar no Github Actions
      - name: Upload arquivo jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-application
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Build Docker Image
        run: |
          docker build \
            -t ecommerce-api:${{ github.sha }} \
            .
