name: CI - Spring Boot

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build, Tests and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      - name: Trivy - Scanner para vulnerabilidades em dependências
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # Armazena o JAR no GitHub Actions
      - name: Upload arquivo jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-application
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Build da imagem Docker
        run: |
          docker build \
            -t ecommerce-api:${{ github.sha }} \
            .

      - name: Trivy - Scanner de vulnerabilidade de imagem Docker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ecommerce-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # Autenticação no Docker Hub
      - name: Login Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Publicação da imagem
      - name: Push Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="$DOCKERHUB_USERNAME/ecommerce-api"

          docker tag ecommerce-api:${{ github.sha }} $IMAGE_NAME:${{ github.sha }}
          docker tag ecommerce-api:${{ github.sha }} $IMAGE_NAME:latest

          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest